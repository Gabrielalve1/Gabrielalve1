name: Validar Meu Dinheiro
on:
  push:
    branches: [main]
    paths:
      - 'financeiro/**'
      - '.github/workflows/pages-financeiro.yml'
  workflow_dispatch:
# GitHub Pages already publishes main at the repository root. A second
# deployment of only financeiro/ overwrote that site and broke /financeiro/.
# Keep the built-in Pages publication as the sole deployment pipeline.
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar scripts do diário
        run: |
          node --check financeiro/engine.js
          node --check financeiro/app.js
          node --check financeiro/service-worker.js
