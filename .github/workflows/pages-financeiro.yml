name: Publicar Meu Dinheiro
on:
  push:
    branches: [main]
    paths:
      - 'financeiro/**'
      - '.github/workflows/pages-financeiro.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preparar ícones do app
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin
          mkdir -p financeiro/icons
          rsvg-convert -w 180 -h 180 financeiro/icon.svg -o financeiro/icons/icon-180.png
          rsvg-convert -w 192 -h 192 financeiro/icon.svg -o financeiro/icons/icon-192.png
          rsvg-convert -w 512 -h 512 financeiro/icon.svg -o financeiro/icons/icon-512.png
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: './financeiro'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
